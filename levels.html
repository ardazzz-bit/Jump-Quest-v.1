<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Level | JUMP QUEST</title>
    <link rel="stylesheet" href="css/levels.css">
</head>
<body>

    <div class="sky-decoration cloud cloud-one"></div>
    <div class="sky-decoration cloud cloud-two"></div>
    <div class="sky-decoration cloud cloud-three"></div>

    <header class="levels-header">
        <button class="back-btn" onclick="goHome()">← BACK</button>

        <div class="header-title">
            <h1>SELECT LEVEL</h1>
            <p>YOUR ADVENTURE CONTINUES!</p>
        </div>

        <div class="progress-box">
            <span>WORLD 1 PROGRESS</span>
            <strong id="progressText">0 / 30</strong>
        </div>
    </header>

    <main class="page-container">

        <section class="intro-panel">
            <div>
                <h2>WORLD 1 — THE LOST KINGDOM</h2>
                <p>Thirty levels. Five regions. Five bosses. One final battle.</p>
            </div>
            <div class="intro-star">★</div>
        </section>

        <div id="levelsContainer" class="worlds-container">
            <!-- Regions and levels are created by JavaScript -->
        </div>

        <footer class="levels-footer">
            <p>★ JUMP QUEST ★</p>
            <span>KEEP JUMPING, HERO!</span>
        </footer>

    </main>

    <script src="js/levels.js"></script>
</body>
</html>
